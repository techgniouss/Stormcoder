name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/build-tests.mjs && node scripts/run-tests.mjs
      - run: node test/e2e.mjs
      - run: node test/remote-e2e.mjs
      - run: node test/android-shell.mjs
      - run: xvfb-run -a node test/electron-smoke.mjs
      - name: Relay worker tests
        run: cd openvs-relay && npm ci && node scripts/run-tests.mjs
  # The Android project cannot be built by `npm test`, so this is the only place a resource or
  # Gradle error shows up before a person builds it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cd android && npm ci && npm run web && npx cap sync android
      - run: cd android/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stormcoder-remote-debug-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
