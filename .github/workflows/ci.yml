name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/build-tests.mjs && node scripts/run-tests.mjs
      - run: node test/e2e.mjs
      - run: xvfb-run -a node test/electron-smoke.mjs
