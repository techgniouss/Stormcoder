name: Release
on:
  push:
    tags: ['v*']
    # Pushing the `release` branch publishes the version in package.json.
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 1.0.0)
        required: true
jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the version from the tag or input
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
            refs/heads/release) V="$(node -p "require('./package.json').version")" ;;
            *) V="$INPUT_VERSION" ;;
          esac
          npm version --no-git-tag-version --allow-same-version "$V"
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
