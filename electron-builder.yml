appId: dev.mjolnir.app
productName: Mjolnir
copyright: Copyright (c) Mjolnir contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!dist/**/*.map"
asarUnpack:
  # `wrangler` is run from here to deploy the hosted relay, and a process cannot cd into an asar.
  - dist/openvs-relay/**
  - node_modules/sql.js/**
protocols:
  - name: Mjolnir
    schemes: [mjolnir]
publish:
  provider: github
  releaseType: release
win:
  target: [{ target: nsis, arch: [x64] }]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  target: [{ target: dmg, arch: [x64, arm64] }, { target: zip, arch: [x64, arm64] }]
linux:
  category: Development
  target: [AppImage, deb]
  maintainer: Mjolnir contributors
